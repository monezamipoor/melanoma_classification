# Dataset Arguments
dataset:
  image_size: [224, 224] # Width, Height of input images
  use_groupkfold: false
  n_splits: 3
  downsampling_rate: 0.3 # Keep X% of class 0
  oversampling_rate: 5 # Leave at 1 to disable
  augmentations:
    apply_augmentation_to_all: false
    #horizontal_flip: 0.2
    #vertical_flip: 0.2
    #random_rotation: 10
    #color_jitter: 0.2
    #shift_vertical: 0.1
    #shift_horizontal: 0.1
    #random_zoom: [0.8, 1.2]
    elastic_transform: false
    #random_erasing: 0.2
    #gaussian_noise: 0.1
    gaussian_noise_prob: 0.3
    image_mix_enabled: false
    image_mix_type: column
    image_mix_prob: 0.3
    save_augmentation: false
    aug_save_dir: "/content/drive/MyDrive/melanoma/logs/Sample"
    sample_number: 100

  dataset_train_path: "/content/Melanoma/train"
  dataset_train_csv: "/content/melanoma_classification/data/train-0-11.csv"
  dataset_val_path: "/content/Melanoma/train"
  dataset_test_path: "/content/Melanoma/train"
  dataset_test_csv: "/content/melanoma_classification/data/test-12-14.csv"
  batch_size: 128
  subset: 1.0

# Model Arguments
model:
  backbone: "efficientnet_b0" # Options: resnet18, resnet50, efficientnet_b0, vit_base_mci_224, swin_tiny_patch4_window7_224, convnext_base
  mode: "regular"    # "regular", "contrastive", "svm", "contrastive", "svm+contrastive"
  loss_function: "bce" # 'bce', 'focal', 'dice', 'svm_hinge', 'contrastive', 'bce_auto'
  
  pretrained: true
  output_neurons: 1 # Number of classes
  dropout_rate: 0.3
  freeze_backbone: false
  num_unfrozen_layers: 3
  bce_loss_weights: [1.0]
  dice_loss_smooth: 0.000001

  contrastive_temperature: 0.07
  contrastive_margin: 0.5
  contrastive_svm_lambda: 0.1
  focal_loss:
    gamma: 2.0
    alpha: 0.25
    reduction: "mean"
  hybrid:
    enabled: False

# Training Arguments
training:
  
  optimizer: "adam" # Options: adam, sgd, adamw, adagrad, amsgrad
  learning_rate: 0.001
  scheduler: "None" # Options: cosine, step, reduce_on_plateau
  decay_rate: 0.1 # For step scheduler
  step_size: 5 8

  epochs: 10
  warmup_epochs: 0

  freeze_backbone_epochs: 0
  contrastive_epochs: 0  # How many epochs to use contrastive pretraining
  
  mixed_precision: false
  gradient_clipping: 1.0

# Testing and Logging Arguments
testing:
  log_dir: "./logs"
  model_save_strategy: "best" # Options: all, best, last, none
  model_save_metrics: ["AUC"]
  model_metrics: ["AUC", "Accuracy", "F1", "Precision", "Recall", "cm"]
  checkpoint_dir: "./checkpoints"
  wandb:
    project_name: "Melanoma"
    entity: "ashkan132-fard"
    api_key: "e32e31ab856f60bb3a50f3439a4526ecee094986"
  early_stopping:
    patience: 10
    min_delta: 0.001
  threshold_value: 0.5 # Set 'auto' for automatically setting threshold, otherwise enter the number
