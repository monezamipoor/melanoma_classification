# Dataset Arguments
dataset:
  image_size: [224, 224] # Width, Height of input images
  use_groupkfold: false
  n_splits: 3
  downsampling_rate: 0.3 # Keep X% of class 0
  oversampling_rate: 5 # Leave at 1 to disable
  augmentations:
    #horizontal_flip: 0.5
    vertical_flip: 0.4
    #random_rotation: 10
    color_jitter: 0.2
    #shift_vertical: 0.1
    #shift_horizontal: 0.1
    random_zoom: [0.9, 1.1]
    elastic_transform: false
    random_erasing: 0.2
    #gaussian_noise: 0.1
    gaussian_noise_prob: 0.3
    image_mix_enabled: true
    image_mix_type: column
    image_mix_prob: 0.3
    save_augmentation: true
    aug_save_dir: "/content/drive/MyDrive/melanoma/logs/Sample"
    sample_number: 100

  #stratified_batching: true  # For maintaining class distribution in batches
  dataset_train_path: "/content/Melanoma/train"
  dataset_train_csv: "/content/drive/MyDrive/melanoma/data/train-0-11.csv"
  dataset_val_path: "/content/Melanoma/train"
  dataset_test_path: "/content/Melanoma/train"
  dataset_test_csv: "/content/drive/MyDrive/melanoma_classification/data/test-12-14.csv"
  dataset_balanced_test_csv: "./data/test-12-14-balanced.csv"
  batch_size: 64
  subset: 1.0

# Model Arguments
model:
  backbone: "efficientnet_b0" # Options: resnet18, resnet50, efficientnet_b0, vit_base_mci_224, swin_tiny_patch4_window7_224
  pretrained: true
  output_neurons: 1 # Number of classes
  dropout_rate: 0.3
  freeze_backbone: false
  num_unfrozen_layers: 0 #unfreeze layers before the classifier (freeze backbone must be true)
  loss_function: "bce_auto" # 'bce', 'focal', 'dice'
  bce_loss_weights: [1.0]
  dice_loss_smooth: 0.00005
  focal_loss:
    gamma: 2.0
    alpha: 0.4
    reduction: "mean"
  hybrid: # This is to support the in-progress implementation of CNN >> Transformer (James)
    enabled: False # Set to False for all tests (for now)
    embed_dim: 128
    num_transformer_layers: 2
    num_heads: 4

# Training Arguments
training:
  optimizer: "adamw" # Options: adam, sgd, adamw, adagrad, amsgrad
  learning_rate: 0.00001
  scheduler: "none" # Options: cosine, step, reduce_on_plateau, none
  decay_rate: 0.1 # For step scheduler
  step_size: 30 # Epochs between decay for step scheduler

  epochs: 20

  warmup_epochs: 0
  #freeze_pretrained: false # Whether to freeze backbone layers
  mixed_precision: false # Whether to use mixed precision training
  gradient_clipping: 1.0

# Testing and Logging Arguments
testing:
  log_dir: "./logs" # YAML-TIMESTAMP gets created under here
  model_save_strategy: "best" # Options: all, best, last, none
  model_save_metrics: ["AUC"]
  model_metrics: ["AUC", "Accuracy", "F1", "Precision", "Recall", "cm"]
  checkpoint_dir: "./checkpoints" # creates this as a sub-dir under each run
  wandb:
    project_name: "melanoma-playpen" # yourproject
    entity: "jc03172-university-of-surrey" # yourorg
    api_key: "ec4f88fbbc7df980f677f5b76580d03e52373b6e" # Replace with your actual key
  early_stopping:
    patience: 10
    min_delta: 0.001
    threshold_value: "auto" # Set 'auto' for automatically setting threshold, otherwise enter the number
