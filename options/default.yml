# Dataset Arguments
dataset:
  use_groupkfold: false
  n_splits: 3
  image_size: [224, 224]  # Width, Height of input images
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.3
    random_rotation: 15  # degrees
    color_jitter: 0.2  # brightness, contrast, saturation
  oversampling_rate: 20  # For imbalanced datasets - Multiplication factor

  #stratified_batching: true  # For maintaining class distribution in batches
  dataset_train_path: "/content/Melanoma/train"
  dataset_train_csv: "/content/Melanoma/train.csv"
  dataset_val_path: "/content/Melanoma/train"
  dataset_test_path: "/content/Melanoma/test"
  batch_size: 32

  # dataset_train_path: "./data/test"
  # k_fold_validation: 5 # Options: k, none
  # test: false # Include test dataset as well or only train and validation
  # add_metadata: false # adding or removing metadata

# Model Arguments
model:
  backbone: "efficientnet_b0" # Options: resnet18, resnet50, efficientnet_b0, vit_base
  pretrained: true
  output_neurons: 1 # Number of classes
  dropout_rate: 0.3
  freeze_backbone: true
  num_frozen_layers: 3
  loss_function: 'bce'      # 'bce', 'focal', 'dice'
  bce_loss_weights: [1.0]   # Make this a factor of the majority:minority class imbalance. E.g. [4.0] = 4 majority : 1 minority
  dice_loss_smooth: 0.000001
  focal_loss:
    gamma: 2.0
    alpha: 0.25
    reduction: "mean"

# Training Arguments
training:
  optimizer: "adamw"  # Options: adam, sgd, adamw, amsgrad
  learning_rate: 0.003
  scheduler: "step"  # Options: cosine, step, reduce_on_plateau
  decay_rate: 0.1  # For step scheduler
  step_size: 30  # Epochs between decay for step scheduler
  epochs: 10
  warmup_epochs: 5
  mixed_precision: false # Whether to use mixed precision training
  gradient_clipping: 1.0

# Testing and Logging Arguments
testing:
  log_dir: "./logs"   # YAML-TIMESTAMP gets created under here
  model_save_strategy: "best" # Options: all, best, last, none
  model_save_metrics: ["AUC"]
  model_metrics: ["AUC","Accuracy","F1 Score", "Precision", "Recall", "cm"]
  checkpoint_dir: "./checkpoints"   # creates this as a sub-dir under each run
  wandb:
    project_name: #"melanoma-full-runs" # ONLY USE "melanoma-full-runs" FOR COMPLETE TESTS. OTHERWISE USE "melanoma-playpen"
    entity: #"jc03172-university-of-surrey" # yourorg
    api_key: # Replace with your actual key
  early_stopping:
    patience: 10
    min_delta: 0.001
