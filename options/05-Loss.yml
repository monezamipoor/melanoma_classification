# Dataset Arguments
dataset:
  image_size: [224, 224] # Width, Height of input images
  use_groupkfold: False
  n_splits: 3
  downsampling_rate: 0.1 # Keep X% of class 0
  oversampling_rate: 5 # Leave at 1 to disable
  augmentations:
    apply_augmentation_to_all: false
    horizontal_flip: 0
    vertical_flip: 0.2
    color_jitter: 0.2
    elastic_transform: false
    image_mix_enabled: false
    image_mix_prob: 0.3
    aug_save_dir: "/content"
    sample_number: 20
  dataset_train_path: "./data/train"
  dataset_train_csv: "./data/train-0-11.csv"
  dataset_val_path: "./data/train"
  dataset_test_csv: "./data/test-12-14.csv"
  dataset_balanced_test_csv: "./data/test-12-14-balanced.csv"
  dataset_test_path: "./data/train"
  batch_size: 32
  subset: 1.0

# Model Arguments
model:
  backbone: "efficientnet_b0" # Options: resnet18, resnet50, efficientnet_b0, vit_base_mci_224, swin_tiny_patch4_window7_224
  pretrained: true
  output_neurons: 1 # Number of classes
  dropout_rate: 0.2
  num_unfrozen_layers: 0 #unfreeze layers before the classifier
  mode: "regular"    # "regular", "svm", "contrastive", "svm+contrastive"
  combined_loss: True
  loss_function: "bce" # 'bce', 'focal', 'dice', 'svm_hinge', 'contrastive'
  second_loss: "triplet"
  triplet_margin: 0.5
  loss_combination_weight: 0.5
  bce_loss_weights: [5.0]
  dice_loss_smooth: 0.000001
  focal_loss:
    gamma: 2.0
    alpha: 0.25
    reduction: "mean"
  hybrid:
    enabled: False
  contrastive_temperature: 0.07
  contrastive_margin: 0.5
  contrastive_svm_lambda: 0.1
  use_metadata: False
  freeze_backbone: false

# Training Arguments
training:
  optimizer: "adamw" # Options: adam, sgd, adamw, adagrad, amsgrad
  learning_rate: 0.001
  scheduler: "cosine" # Options: cosine, step, reduce_on_plateau
  decay_rate: 0.1 # For step scheduler
  step_size: 30 # Epochs between decay for step scheduler
  contrastive_epochs: 0
  epochs: 20
  warmup_epochs: 0
  freeze_pretrained: false # Whether to freeze backbone layers
  mixed_precision: false # Whether to use mixed precision training
  gradient_clipping: 1.0
  freeze_backbone: false
  freeze_backbone_epochs: 2

# Testing and Logging Arguments
testing:
  log_dir: "./logs"   # YAML-TIMESTAMP gets created under here
  model_save_strategy: "best" # Options: all, best, last, none
  model_save_metrics: ["AUC"]
  model_metrics: ["AUC","Accuracy","F1", "Precision", "Recall"]
  checkpoint_dir: "./checkpoints"   # creates this as a sub-dir under each run
  early_stopping:
    patience: 10
    min_delta: 0.001
  threshold_value: 0.5 # Set 'auto' for automatically setting threshold, otherwise enter the number
